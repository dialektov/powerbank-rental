events {}

http {
    upstream rental_api {
        server rental-api-1:8000;
        server rental-api-2:8000;
        keepalive 64;
    }

    # Публичный вход: /internal и /metrics снаружи недоступны.
    server {
        listen 80;

        location /internal/ {
            return 404;
        }

        location = /metrics {
            return 404;
        }

        location / {
            proxy_pass http://rental_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    # Внутренний вход для станций и rental-worker, наружу не публикуется.
    server {
        listen 8081;

        location / {
            proxy_pass http://rental_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
