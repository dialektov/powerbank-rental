x-rental-api: &rental-api
  build:
    context: ./rental_api
    target: runtime
  environment:
    DATABASE_URL: postgresql://rental:rental@postgres:5432/rental
    REDIS_URL: redis://redis:6379/0
    STUBS_URL: http://external-stubs:3629
    CURSOR_SECRET: ${CURSOR_SECRET:-dev-cursor-secret}
    READ_PROTECTION_ENABLED: ${READ_PROTECTION_ENABLED:-true}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
    external-stubs:
      condition: service_started
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: rental
      POSTGRES_DB: rental
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental -d rental"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  external-stubs:
    build: ./external_stubs
    environment:
      RENTAL_INTERNAL_URL: http://nginx:8081
      STUBS_DB_PATH: /data/stubs.sqlite3
    volumes:
      - stubsdata:/data
    ports:
      - "3629:3629"
    restart: unless-stopped

  rental-api-1:
    <<: *rental-api
    hostname: rental-api-1

  rental-api-2:
    <<: *rental-api
    hostname: rental-api-2

  rental-worker:
    build: ./rental_worker
    environment:
      DATABASE_URL: postgresql://rental:rental@postgres:5432/rental
      RENTAL_INTERNAL_URL: http://nginx:8081
      STUBS_URL: http://external-stubs:3629
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${PUBLIC_PORT:-8080}:80"
    depends_on:
      - rental-api-1
      - rental-api-2

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  integration-tests:
    profiles: ["test"]
    build:
      context: ./rental_api
      target: test
    environment:
      RENTAL_URL: http://nginx
      STUBS_URL: http://external-stubs:3629
      TEST_DATABASE_URL: postgresql://rental:rental@postgres:5432/rental
    command: ["pytest", "tests/integration", "-q", "-p", "no:warnings"]
    depends_on:
      - nginx

volumes:
  pgdata:
  stubsdata:
